services:
  - type: web
    name: phishguard-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker detect_url.backend.app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # User must set this in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: .:detect_url
